name: Validate & Publish Skills

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate skills
        run: bash scripts/validate-skills.sh

      - name: Evaluate deterministic skill routing
        run: python3 bin/eval-skill-router.py

      - name: Verify npm package closure
        run: node bin/check-package-closure.mjs

      - name: Validate theme.tools skill integration
        run: node bin/check-theme-tools-skill-integration.mjs

      - name: Check canonical instruction policy drift
        run: |
          node --experimental-strip-types bin/gen-harness-manifests.mjs \
            --check-publish-instructions \
            --source-root "$GITHUB_WORKSPACE" \
            --expected-revision "$(git rev-parse HEAD)"

      - name: Check bounded canonical/generated/installed/publish drift
        run: node --experimental-strip-types bin/bounded-drift-detector.ts --source-root "$GITHUB_WORKSPACE" --source-revision "$(git rev-parse HEAD)" --json

      - name: Validate pack cross-link integrity
        run: node scripts/validate-packs.mjs

      - name: Verify scoped platform policy
        run: |
          python3 scripts/check-platform-policy.py
          python3 -m unittest discover -s scripts -p test_platform_policy.py

      - name: Validate GitHub Actions are SHA-pinned (supply chain)
        run: node scripts/sha-pin-actions.mjs --check .github/workflows/*.yml

      - name: Self-lint YAML (catches lefthook.yml meta-bug regressions, pass-41)
        run: |
          python3 -m pip install --quiet --user yamllint
          ~/.local/bin/yamllint -d "{extends: relaxed, rules: {line-length: disable, document-start: disable, truthy: disable}}" \
            templates/lint-stack/lefthook.yml \
            lefthook.yml \
            .github/workflows/*.yml

      - name: Self-lint Markdown (whole-repo, pass-43/44/45)
        run: |
          npx --yes markdownlint-cli2@^0.18.1 "**/*.md"

      - name: Self-lint JSON/YAML (Prettier check, pass-46)
        run: |
          # --config explicit prevents cosmiconfig walk-up to a parent referencing
          # plugins not installed in this repo (pass-49 fix).
          npx --yes prettier@3 --config .prettierrc.json --check "**/*.{json,jsonc,yml,yaml}"

      - name: Self-lint Shell (shellcheck + shfmt diff, pass-47)
        run: |
          # Note: ShellCheck is preinstalled on ubuntu-latest. Installing shfmt via go (Go is preinstalled).
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.10.0
          export PATH="$HOME/go/bin:$PATH"
          shellcheck -x -S warning bin/*.sh bin/lib/*.sh scripts/*.sh
          shfmt -i 2 -ci -bn -d bin/*.sh bin/lib/*.sh scripts/*.sh

      - name: Self-lint Workflows (actionlint, pass-48)
        run: |
          # Note: actionlint via Go install. Version-pinned for reproducibility.
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          export PATH="$HOME/go/bin:$PATH"
          actionlint .github/workflows/*.yml

      - name: Check doc counts
        run: |
          EXPECTED=$(grep -o '[0-9]* reference docs' README.md | grep -o '[0-9]*')
          ACTUAL=0
          for dir in [0-9][0-9]-*/; do
            COUNT=$(find "$dir" -maxdepth 1 -name '*.md' ! -name 'SKILL.md' | wc -l)
            ACTUAL=$((ACTUAL + COUNT))
          done
          echo "Expected: $EXPECTED, Actual: $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Doc count mismatch: README says $EXPECTED but found $ACTUAL"
            exit 1
          fi

      - name: Check SKILL.md submodule alignment
        run: |
          ERRORS=0
          for dir in [0-9][0-9]-*/; do
            SKILL="${dir}SKILL.md"
            [ -f "$SKILL" ] || continue
            IN_SUBMODULES=false
            while IFS= read -r line; do
              if echo "$line" | grep -q '^submodules:'; then
                IN_SUBMODULES=true
                continue
              fi
              if $IN_SUBMODULES; then
                if echo "$line" | grep -q '^  - '; then
                  # shellcheck disable=SC2001
                  FILE=$(echo "$line" | sed 's/^  - //')
                  if [ ! -f "${dir}${FILE}" ]; then
                    echo "::error::${SKILL}: submodule ${FILE} not found on disk"
                    ERRORS=$((ERRORS + 1))
                  fi
                elif echo "$line" | grep -q '^---'; then
                  break
                elif ! echo "$line" | grep -q '^  '; then
                  break
                fi
              fi
            done < "$SKILL"
          done
          [ $ERRORS -eq 0 ] || exit 1

  sync-cross-platform:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: validate
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Sync plugin versions from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            [ -f "$f" ] && sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" "$f"
          done

      - name: Project canonical policy into cross-platform instruction surfaces
        run: |
          REVISION=$(git rev-parse HEAD)
          node --experimental-strip-types bin/gen-harness-manifests.mjs \
            --publish-instructions \
            --source-root "$GITHUB_WORKSPACE" \
            --expected-revision "$REVISION"

      - name: Generate llms-full.txt
        run: |
          {
            cat llms.txt
            echo ""
            echo "## Full Conventions"
            echo ""
            cat CONVENTIONS.md
          } > llms-full.txt

      - name: Generate Codex .agents/ directory
        run: node bin/gen-codex-skills.mjs

      - name: Normalize generated markdown + JSON/YAML (pass-45/46 — prevents drift on next CI run)
        run: |
          npx --yes markdownlint-cli2@^0.18.1 --fix "**/*.md" || true
          npx --yes prettier@3 --config .prettierrc.json --write "**/*.{json,jsonc,yml,yaml}" || true

      - name: Commit cross-platform files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md .cursorrules .windsurfrules .clinerules GEMINI.md \
            .github/copilot-instructions.md .github/instructions/ llms-full.txt \
            .amazonq/ .rules .junie/ .augment-guidelines .augment/ \
            .aider-conventions.md AMP.md CODEX.md .agents/ .trae/ .tabnine/ \
            .kilo/ .roo/ .continue/ .cursor/ .windsurf/ .openhands/ \
            .aiassistant/ .kiro/ .void/ .bolt/ QODO.MD \
            .claude-plugin/ replit.md .devin/ .goose/
          # shellcheck disable=SC2015  # intentional: stage→if-empty-echo else-commit; echo cannot fail
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: sync cross-platform rule files [skip ci]"
          git push || true

  publish-npm:
    runs-on: ubuntu-latest
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "Emdash Skills $TAG" \
            --generate-notes \
            --notes-start-tag "$(git tag --sort=-version:refname | head -2 | tail -1)"

  publish-jsr:
    runs-on: ubuntu-latest
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - name: Validate the JSR package
        run: deno publish --dry-run --config jsr.json
      - name: Publish to JSR
        run: deno publish --config jsr.json

  publish-continue-hub:
    runs-on: ubuntu-latest
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Publish to Continue Hub (rules.so)
        run: |
          npx rules-cli publish --token "${{ secrets.CONTINUE_HUB_TOKEN }}" 2>/dev/null || echo "Continue Hub publish skipped (no token)"
        continue-on-error: true

  publish-github-skills:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Publish via gh skill
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-skill 2>/dev/null || true
          gh skill publish
