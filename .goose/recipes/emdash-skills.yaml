name: emdash-skills
description: "23-category product-building OS. CF Workers+Hono, React 19+Vite / Angular 22+Spartan, D1, Drizzle, Clerk, Square/Stripe."
version: "2.0.0"

instructions: |
  Load CONVENTIONS.md for stack defaults. Load _router.md for skill routing.
  23 categories, 151 reference docs, 55 agents.

  Stack: CF Workers + Hono | React 19 + Vite + ui.theme.tools (`@theme.tools/ui` — exclusive component system for ALL sites, apps, dashboards, admin consoles, calendars, and portals; NO Angular / NO Spartan UI) | D1/Neon | Drizzle v1-rc | Better Auth | Stripe + Link (default) · Square on request | Inngest | Amazon SES | Bun | Playwright v1.63+ | PostHog | Sentry

  Rules:
  - TypeScript strict, never `any`, prefer `interface` over `type`
  - Hono inline handlers for RPC type inference
  - Zod validation on all inputs
  - TDD: failing test first, Playwright 6 breakpoints
  - Dark-first design, #060610 bg, #00E5FF accent
  - Deploy to CF Workers, purge CDN after every deploy

context_files:
  - CONVENTIONS.md
  - _router.md
  - SKILL_PROFILES.md
