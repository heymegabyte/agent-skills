# credential-and-fleet-hygiene.yml — fleet credential-handling invariants.
#
# PROVENANCE: authored 2026-10-10 alongside the Infisical/Agent-Vault brokering
# integration (ADR-0001). Each rule encodes a real class of credential leak the
# autonomous fleet must never ship — the "bug → tested invariant" compiler of
# rules/lint-doctrine.md § Self-improving. Fixtures: tests/credential-and-fleet-hygiene.sh.
#
# Scope: shell scripts (the fleet is bash-heavy: get-secret, claude-pool,
# with-subscription-cli, bootstrap). Pairs with the TypeScript secret rules in
# ../.semgrep/baseline.yml (hardcoded-cf-token, hardcoded-anthropic-key).
# Run:  semgrep scan --oss-only --config <this dir> --error
# Test: semgrep --test --config <this dir> <this dir>/tests
rules:
  - id: secret-written-to-github-actions-file
    languages: [bash]
    severity: ERROR
    pattern-regex: '\$\{?[A-Za-z_]*(TOKEN|SECRET|API_KEY|PASSWORD|_PAT)[A-Za-z_]*\}?[^\n]*>>\s*"?\$\{?GITHUB_(OUTPUT|ENV|STATE)'
    paths:
      include: ["**/*.sh", "**/*.bash"]
    message: |
      A secret-looking value is being written to a GitHub Actions command file
      ($GITHUB_OUTPUT/$GITHUB_ENV/$GITHUB_STATE). These files are persisted and
      exposed to later steps — a secret there leaks across the job. Pass secrets
      via masked `::add-mask::` + step env, or keep them in Infisical/Agent Vault
      and inject at use. See rules/fleet-secret-handling → secrets-portable-resolution.md.

  - id: hardcoded-cloudflare-token-shell
    languages: [bash]
    severity: ERROR
    pattern-regex: 'CLOUDFLARE_API_(TOKEN|KEY)=["'']?[A-Za-z0-9_-]{30,}'
    paths:
      include: ["**/*.sh", "**/*.bash"]
    message: |
      Hardcoded Cloudflare credential in a shell script. Management tokens never
      live in source — resolve at runtime via `get-secret CLOUDFLARE_API_TOKEN`
      (chezmoi/Infisical/Agent-Vault-brokered) per secrets-portable-resolution.md.
      Application Workers get a Secrets Store binding, never a management token.

  - id: hardcoded-broker-identity-secret
    languages: [bash]
    severity: ERROR
    pattern-regex: '(AGENT_VAULT_TOKEN|INFISICAL_TOKEN|INFISICAL_CLIENT_SECRET|DEEPSEEK_API_KEY)=["'']?[A-Za-z0-9._-]{20,}'
    paths:
      include: ["**/*.sh", "**/*.bash"]
    message: |
      A broker/identity secret (Agent Vault token, Infisical machine-identity,
      or DeepSeek key) is hardcoded. These are the keys to the whole secret
      backend — commit one and the vault is compromised. Source them from the
      environment at runtime (GitHub OIDC exchange, machine identity), never literal.

  - id: secret-echoed-to-stdout
    languages: [bash]
    severity: WARNING
    # \n in the negated classes keeps the match ON ONE LINE. The keyword must END the
    # var name (followed by }/quote/space/)/;/EOL) so VALUE-holding vars ($X_TOKEN,
    # $X_API_KEY) match but metadata flags ($GET_SECRET_PRESENT, $TOKEN_NAME) do NOT —
    # false-positive control (brief). Trailing [^>\n]*$ => no redirect (true stdout echo).
    pattern-regex: '\b(echo|printf)\b[^|<>\n]*\$\{?[A-Za-z_]*(TOKEN|SECRET|API_KEY|PASSWORD)(\}|["'' );]|$)[^>\n]*$'
    paths:
      include: ["**/*.sh", "**/*.bash"]
    message: |
      A secret-looking variable is being echoed/printed. Fleet logs are retained
      and surfaced in GitHub run summaries — printing a credential leaks it. Send
      only non-secret diagnostics to stderr; the resolved secret value is the ONLY
      thing a resolver puts on stdout, and callers must capture, never re-print it.

  - id: infisical-interactive-login-in-script
    languages: [bash]
    severity: WARNING
    # ^[^#\n]* => the command is NOT inside a comment (a `# …infisical login…` doc line
    # is excluded; a real `infisical login` command still fires). False-positive control.
    pattern-regex: '^[^#\n]*\binfisical\s+login\b'
    paths:
      include: ["**/*.sh", "**/*.bash"]
    message: |
      `infisical login` is interactive — forbidden in non-interactive fleet
      scripts. Authenticate with a machine identity (INFISICAL_TOKEN / universal
      auth) or GitHub OIDC exchange per get-secret-infisical.sh + the OIDC flow in
      rules/agent-vault-brokering.md.
